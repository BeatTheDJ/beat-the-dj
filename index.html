<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat the DJ — Stage 1</title>

<style>
:root{
  --bg:#090909;
  --panel:#151515;
  --panel2:#202020;
  --text:#f5f5f2;
  --muted:#999;
  --line:#333;
  --accent:#e8ff38;
  --danger:#ff7777;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:28px 16px 45px;
}

header{
  padding:8px 0 28px;
}

.eyebrow{
  font-size:12px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:800;
}

h1{
  font-size:clamp(44px,11vw,72px);
  line-height:.88;
  letter-spacing:-.055em;
  margin:10px 0;
}

.strap{
  margin:0;
  color:#c9c9c4;
  font-size:17px;
  line-height:1.4;
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:12px;
  font-size:13px;
  margin-bottom:14px;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
  margin-right:8px;
}

.live .dot{
  background:var(--accent);
  box-shadow:0 0 12px rgba(232,255,56,.4);
}

.timer{
  font-variant-numeric:tabular-nums;
  font-weight:800;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
}

.card h2{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.14em;
  color:#aaa;
  margin:0 0 11px;
}

.round-title{
  font-size:25px;
  font-weight:800;
}

.round-sub{
  color:var(--muted);
  font-size:14px;
  margin-top:4px;
}

.choices{
  display:grid;
  gap:10px;
}

.choice{
  width:100%;
  text-align:left;
  background:var(--panel2);
  border:1px solid #383838;
  color:var(--text);
  border-radius:13px;
  padding:15px;
  cursor:pointer;
  font:inherit;
}

.choice:hover{
  border-color:#666;
}

.choice:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.choice.picked{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent) inset;
}

.track{
  font-size:17px;
  font-weight:800;
  line-height:1.2;
}

.artist{
  font-size:14px;
  color:#aaa;
  margin-top:4px;
}

.votes{
  height:7px;
  background:#2b2b2b;
  border-radius:99px;
  overflow:hidden;
  margin-top:11px;
}

.bar{
  height:100%;
  background:var(--accent);
  transition:width .3s ease;
}

.vote-row{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  font-size:12px;
  color:#aaa;
}

.vote-row strong{
  color:var(--text);
}

.message{
  min-height:22px;
  margin-top:9px;
  font-size:14px;
}

.error{
  color:var(--danger);
}

.small{
  font-size:12px;
  color:#777;
  line-height:1.45;
}

.refresh{
  border:0;
  background:none;
  color:var(--accent);
  font-weight:800;
  cursor:pointer;
  padding:0;
}

.hidden{
  display:none;
}

footer{
  text-align:center;
  color:#555;
  font-size:11px;
  padding-top:10px;
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="eyebrow">Beat the DJ</div>
  <h1>Stage 1</h1>
  <p class="strap">Your track. The crowd. The DJ. Who wins?</p>
</header>

<div id="status" class="status">
  <span>
    <span class="dot"></span>
    <span id="statusText">Connecting…</span>
  </span>
  <span id="timer" class="timer"></span>
</div>

<section id="roundCard" class="card hidden">
  <h2>Voting now</h2>
  <div id="roundTitle" class="round-title">Stage 1</div>
  <div class="round-sub">Choose the track you want next.</div>
</section>

<section id="choicesCard" class="card hidden">
  <h2>Pick one</h2>
  <div id="choices" class="choices"></div>
  <div id="message" class="message"></div>
</section>

<section id="waitingCard" class="card">
  <div class="round-title">Stand by.</div>
  <div class="round-sub">The next vote will appear here.</div>
</section>

<div class="small">
  One vote per device/browser for the current round.
  Results update automatically.
  <button id="refreshBtn" class="refresh">Refresh</button>
</div>

<footer>
  BEAT THE DJ • STAGE 1
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://lxojmyujlljkhtnudzmr.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4b2pteXVqbGxqa2h0bnVkem1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTU2MTgsImV4cCI6MjEwNDkzMTYxOH0.AicCDkKSifzeK9pE1aHhTbyY4exRMvUD771_vld9wKk";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentRound = null;
let currentOptions = [];
let voteCounts = {};
let votesReadable = true;

let voterToken =
  localStorage.getItem("btd_voter_token");

if (!voterToken) {

  voterToken =
    crypto.randomUUID
      ? crypto.randomUUID()
      : "voter-" +
        Date.now() +
        "-" +
        Math.random().toString(36).slice(2);

  localStorage.setItem(
    "btd_voter_token",
    voterToken
  );
}

function $(id){
  return document.getElementById(id);
}

function setStatus(text, live=false, error=false){

  $("statusText").textContent = text;

  $("status").classList.toggle(
    "live",
    live
  );

  $("statusText").classList.toggle(
    "error",
    error
  );
}

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      character => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[character])
    );
}

async function getOpenRound(){

  const result =
    await db
      .from("rounds")
      .select("*")
      .eq("status","open")
      .order(
        "round_number",
        {ascending:false}
      )
      .limit(1)
      .maybeSingle();

  if(result.error){
    throw result.error;
  }

  return result.data;
}

async function getOptions(roundId){

  const result =
    await db
      .from("options")
      .select(
        "id,round_id,position,label,artist,track"
      )
      .eq("round_id",roundId)
      .order(
        "position",
        {ascending:true}
      );

  if(result.error){
    throw result.error;
  }

  return result.data || [];
}

async function getVoteCounts(roundId){

  const result =
    await db
      .from("votes")
      .select("option_id")
      .eq("round_id",roundId);

  if(result.error){

    console.warn(
      "Vote totals unavailable:",
      result.error
    );

    votesReadable = false;

    return {};
  }

  votesReadable = true;

  const counts = {};

  for(const vote of result.data || []){

    counts[vote.option_id] =
      (counts[vote.option_id] || 0) + 1;

  }

  return counts;
}

function renderOptions(){

  const box = $("choices");

  box.innerHTML = "";

  if(!currentOptions.length){

    box.innerHTML =
      "<div class='round-sub'>No choices have been added to this round yet.</div>";

    return;
  }

  const total =
    Object.values(voteCounts)
      .reduce(
        (sum,n) => sum + n,
        0
      );

  const alreadyVoted =
    localStorage.getItem(
      "btd_voted_" +
      currentRound.id
    );

  currentOptions.forEach(
    (option,index) => {

      const votes =
        Number(
          voteCounts[option.id] || 0
        );

      const percentage =
        total
          ? Math.round(
              votes / total * 100
            )
          : 0;

      const button =
        document.createElement("button");

      button.className = "choice";

      button.dataset.id =
        option.id;

      if(
        alreadyVoted &&
        alreadyVoted === option.id
      ){

        button.classList.add("picked");

      }

      button.innerHTML = `

        <div class="track">
          ${index + 1}. ${esc(option.track || option.label)}
        </div>

        ${
          option.artist
            ? `<div class="artist">${esc(option.artist)}</div>`
            : ""
        }

        <div class="votes">
          <div
            class="bar"
            style="width:${percentage}%"
          ></div>
        </div>

        <div class="vote-row">

          <span>
            ${
              votesReadable
                ? votes +
                  " vote" +
                  (votes === 1 ? "" : "s")
                : "Voting live"
            }
          </span>

          <strong>
            ${
              votesReadable
                ? percentage + "%"
                : ""
            }
          </strong>

        </div>
      `;

      if(alreadyVoted){

        button.disabled = true;

      }else{

        button.onclick =
          () => castVote(
            option.id,
            button
          );

      }

      box.appendChild(button);

    }
  );

  if(alreadyVoted){

    $("message").textContent =
      "You've already voted in this round.";

  }else{

    $("message").textContent = "";

  }
}

async function castVote(
  optionId,
  button
){

  document
    .querySelectorAll(".choice")
    .forEach(
      item => item.disabled = true
    );

  button.classList.add("picked");

  $("message").textContent =
    "Submitting your vote…";

  try{

    const result =
      await db.rpc(
        "cast_vote",
        {
          p_round_id:
            currentRound.id,

          p_option_id:
            optionId,

          p_voter_token:
            voterToken
        }
      );

    if(result.error){
      throw result.error;
    }

    localStorage.setItem(
      "btd_voted_" +
      currentRound.id,
      optionId
    );

    $("message").textContent =
      "Vote counted. Watch the screen.";

    await refresh();

  }catch(error){

    console.error(
      "Vote error:",
      error
    );

    document
      .querySelectorAll(".choice")
      .forEach(
        item => item.disabled = false
      );

    button.classList.remove("picked");

    $("message").innerHTML =
      '<span class="error">' +
      esc(
        error.message ||
        "Vote failed."
      ) +
      "</span>";

  }
}

function updateCountdown(){

  if(
    !currentRound ||
    !currentRound.closed_at
  ){

    $("timer").textContent = "";

    return;
  }

  const remaining =
    Math.max(
      0,
      Math.floor(
        (
          new Date(
            currentRound.closed_at
          ) -
          Date.now()
        ) / 1000
      )
    );

  if(remaining <= 0){

    $("timer").textContent =
      "Closing…";

    return;
  }

  const minutes =
    Math.floor(
      remaining / 60
    );

  const seconds =
    remaining % 60;

  $("timer").textContent =
    String(minutes)
      .padStart(2,"0") +
    ":" +
    String(seconds)
      .padStart(2,"0");
}

async function refresh(){

  try{

    currentRound =
      await getOpenRound();

    if(!currentRound){

      currentOptions = [];
      currentRound = null;

      $("roundCard")
        .classList.add("hidden");

      $("choicesCard")
        .classList.add("hidden");

      $("waitingCard")
        .classList.remove("hidden");

      setStatus(
        "Waiting for Stage 1"
      );

      $("timer").textContent = "";

      return;
    }

    currentOptions =
      await getOptions(
        currentRound.id
      );

    voteCounts =
      await getVoteCounts(
        currentRound.id
      );

    $("roundCard")
      .classList.remove("hidden");

    $("choicesCard")
      .classList.remove("hidden");

    $("waitingCard")
      .classList.add("hidden");

    $("roundTitle")
      .textContent =
        currentRound.title ||
        "Stage 1";

    renderOptions();

    setStatus(
      votesReadable
        ? "Voting is live"
        : "Voting is live • totals hidden",
      true
    );

    updateCountdown();

  }catch(error){

    console.error(
      "Beat the DJ error:",
      error
    );

    setStatus(
      "Connection problem",
      false,
      true
    );

    $("message").innerHTML =
      '<span class="error">' +
      esc(
        error.message ||
        "Unable to connect to the database."
      ) +
      "</span>";

  }
}

$("refreshBtn").onclick =
  refresh;

refresh();

setInterval(
  refresh,
  5000
);

setInterval(
  updateCountdown,
  1000
);

</script>

</body>
</html>
