<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat the DJ — Stage 1</title>

<style>
:root {
  --bg:#090909;
  --panel:#151515;
  --panel2:#202020;
  --text:#f5f5f2;
  --muted:#999;
  --line:#333;
  --accent:#e8ff38;
  --danger:#ff7777;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap {
  max-width:720px;
  margin:auto;
  padding:28px 16px 45px;
}

header {
  padding:8px 0 28px;
}

.eyebrow {
  font-size:12px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:800;
}

h1 {
  font-size:clamp(44px,11vw,72px);
  line-height:.88;
  letter-spacing:-.055em;
  margin:10px 0;
}

.strap {
  margin:0;
  color:#c9c9c4;
  font-size:17px;
  line-height:1.4;
}

.status {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:12px;
  font-size:13px;
  margin-bottom:14px;
}

.dot {
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
  margin-right:8px;
}

.live .dot {
  background:var(--accent);
  box-shadow:0 0 12px rgba(232,255,56,.4);
}

.timer {
  font-variant-numeric:tabular-nums;
  font-weight:800;
}

.card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
}

.card h2 {
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.14em;
  color:#aaa;
  margin:0 0 11px;
}

.round-title {
  font-size:25px;
  font-weight:800;
}

.round-sub {
  color:var(--muted);
  font-size:14px;
  margin-top:4px;
}

.choices {
  display:grid;
  gap:10px;
}

.choice {
  width:100%;
  text-align:left;
  background:var(--panel2);
  border:1px solid #383838;
  color:var(--text);
  border-radius:13px;
  padding:15px;
  cursor:pointer;
  font:inherit;
}

.choice:hover {
  border-color:#666;
}

.choice:disabled {
  opacity:.65;
  cursor:not-allowed;
}

.choice.picked {
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent) inset;
}

.track {
  font-size:17px;
  font-weight:800;
  line-height:1.2;
}

.artist {
  font-size:14px;
  color:#aaa;
  margin-top:4px;
}

.votes {
  height:7px;
  background:#2b2b2b;
  border-radius:99px;
  overflow:hidden;
  margin-top:11px;
}

.bar {
  height:100%;
  background:var(--accent);
  transition:width .3s ease;
}

.vote-row {
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  font-size:12px;
  color:#aaa;
}

.vote-row strong {
  color:var(--text);
}

.message {
  min-height:22px;
  margin-top:9px;
  font-size:14px;
}

.error {
  color:var(--danger);
}

.small {
  font-size:12px;
  color:#777;
  line-height:1.45;
}

.refresh {
  border:0;
  background:none;
  color:var(--accent);
  font-weight:800;
  cursor:pointer;
  padding:0;
}

footer {
  text-align:center;
  color:#555;
  font-size:11px;
  padding-top:10px;
}

.hidden {
  display:none;
}
</style>
</head>

<body>

<div class="wrap">

<header>
<div class="eyebrow">Beat the DJ</div>

<h1>Stage 1</h1>

<p class="strap">
Your track. The crowd. The DJ. Who wins?
</p>
</header>


<div id="status" class="status">

<span>
<span class="dot"></span>
<span id="statusText">Connecting…</span>
</span>

<span id="timer" class="timer"></span>

</div>


<section id="roundCard" class="card hidden">

<h2>Voting now</h2>

<div id="roundTitle" class="round-title">
Stage 1
</div>

<div id="roundSub" class="round-sub">
Choose the track you want next.
</div>

</section>


<section id="choicesCard" class="card hidden">

<h2>Pick one</h2>

<div id="choices" class="choices"></div>

<div id="message" class="message"></div>

</section>


<section id="waitingCard" class="card">

<div class="round-title">
Stand by.
</div>

<div class="round-sub">
The next vote will appear here.
</div>

</section>


<div class="small">

One vote per device/browser for the current round.
Results update automatically.

<button id="refreshBtn" class="refresh">
Refresh
</button>

</div>


<footer>
BEAT THE DJ • STAGE 1
</footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const CONFIG = {

SUPABASE_URL:
"https://lxojmyujlljkhtnudzmr.supabase.co",

SUPABASE_ANON_KEY:
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4b21teXVqbGxqa2h0bnVkem1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTU2MTgsImV4cCI6MjEwNDkzMTYxOH0.AicCDkKSifzeK9pE1aHhTbyY4exRMvUD771_vld9wKk",

ROUND_TABLE:
"rounds",

ENTRY_TABLE:
"round_entries",

VOTE_RPC:
"cast_vote",

TEST_ROUND_ID:
""

};


const db = supabase.createClient(
CONFIG.SUPABASE_URL,
CONFIG.SUPABASE_ANON_KEY
);


const $ = id =>
document.getElementById(id);


let currentRound = null;
let currentEntries = [];


let voterToken =
localStorage.getItem("btd_voter_token");


if (!voterToken) {

voterToken =
crypto.randomUUID
? crypto.randomUUID()
: "voter-" +
Date.now() +
"-" +
Math.random().toString(36).slice(2);

localStorage.setItem(
"btd_voter_token",
voterToken
);

}


function field(object,names,fallback="") {

for (const name of names) {

if (
object &&
object[name] !== null &&
object[name] !== undefined
) {

return object[name];

}

}

return fallback;

}


function esc(value) {

return String(value ?? "")
.replace(
/[&<>"']/g,
character => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[character])
);

}


function setStatus(
text,
live=false,
error=false
) {

$("statusText").textContent=text;

$("status").classList.toggle(
"live",
live
);

$("statusText").classList.toggle(
"error",
error
);

}


async function findRound() {

if (CONFIG.TEST_ROUND_ID) {

const result =
await db
.from(CONFIG.ROUND_TABLE)
.select("*")
.eq(
"id",
CONFIG.TEST_ROUND_ID
)
.single();

if (result.error) {
throw result.error;
}

return result.data;

}


for (
const status of
["live","open","active"]
) {

const result =
await db
.from(CONFIG.ROUND_TABLE)
.select("*")
.eq(
"status",
status
);


if (
!result.error &&
result.data &&
result.data.length
) {

const stageOne =
result.data.find(
round =>
/stage\s*1/i.test(
field(
round,
["title","name"],
""
)
)
);


if (stageOne) {
return stageOne;
}

return result.data[0];

}

}


const result =
await db
.from(CONFIG.ROUND_TABLE)
.select("*")
.order(
"created_at",
{
ascending:false
}
)
.limit(20);


if (result.error) {
throw result.error;
}


return (
result.data || []
).find(
round =>
/stage\s*1/i.test(
field(
round,
["title","name"],
""
)
)
) || null;

}


async function loadEntries(roundId) {

const result =
await db
.from(CONFIG.ENTRY_TABLE)
.select("*")
.eq(
"round_id",
roundId
);


if (result.error) {
throw result.error;
}


return result.data || [];

}


function render() {

const box =
$("choices");

box.innerHTML = "";


const entries =
currentEntries.map(entry => ({

...entry,

title:
field(
entry,
[
"title",
"track_title",
"song",
"track"
],
"Untitled track"
),

artist:
field(
entry,
[
"artist",
"artist_name",
"performer"
],
""
),

votes:
Number(
field(
entry,
[
"votes",
"vote_count",
"score"
],
0
)
) || 0

}));


const total =
entries.reduce(
(sum,entry) =>
sum + entry.votes,
0
);


entries.forEach(
(entry,index) => {

const button =
document.createElement(
"button"
);

button.className =
"choice";

button.dataset.id =
entry.id;


const percentage =
total
? Math.round(
entry.votes /
total *
100
)
: 0;


button.innerHTML = `

<div class="track">
${index + 1}. ${esc(entry.title)}
</div>

<div class="artist">
${esc(entry.artist)}
</div>

<div class="votes">

<div
class="bar"
style="width:${percentage}%"
></div>

</div>

<div class="vote-row">

<span>
${entry.votes}
vote${entry.votes === 1 ? "" : "s"}
</span>

<strong>
${percentage}%
</strong>

</div>

`;


button.onclick =
() =>
vote(
entry.id,
button
);


box.appendChild(
button
);

}
);


const alreadyVoted =
localStorage.getItem(
"btd_voted_" +
currentRound.id
);


if (alreadyVoted) {

document
.querySelectorAll(
".choice"
)
.forEach(button => {

button.disabled = true;

if (
button.dataset.id ===
alreadyVoted
) {

button.classList.add(
"picked"
);

}

});


$("message").textContent =
"You've already voted in this round.";

}

}


async function vote(
entryId,
button
) {

document
.querySelectorAll(
".choice"
)
.forEach(
button =>
button.disabled = true
);


button.classList.add(
"picked"
);


$("message").textContent =
"Submitting your vote…";


try {

const result =
await db.rpc(
CONFIG.VOTE_RPC,
{

p_round_id:
currentRound.id,

p_entry_id:
entryId,

p_voter_token:
voterToken

}
);


if (result.error) {
throw result.error;
}


localStorage.setItem(
"btd_voted_" +
currentRound.id,
entryId
);


$("message").textContent =
"Vote counted. Watch the screen.";


await refresh();


} catch (error) {

document
.querySelectorAll(
".choice"
)
.forEach(
button =>
button.disabled = false
);


$("message").innerHTML =
'<span class="error">' +
esc(
error.message ||
"Vote failed."
) +
"</span>";

}

}


function countdown() {

if (
!currentRound ||
!currentRound.ends_at
) {

$("timer").textContent =
"";

return;

}


const seconds =
Math.max(
0,
Math.floor(
(
new Date(
currentRound.ends_at
) -
Date.now()
) / 1000
)
);


if (seconds <= 0) {

$("timer").textContent =
"Closing…";

return;

}


const minutes =
Math.floor(
seconds / 60
);


const remainingSeconds =
seconds % 60;


$("timer").textContent =
String(minutes)
.padStart(2,"0") +
":" +
String(remainingSeconds)
.padStart(2,"0");

}


async function refresh() {

try {

currentRound =
await findRound();


if (!currentRound) {

$("roundCard")
.classList
.add("hidden");

$("choicesCard")
.classList
.add("hidden");

$("waitingCard")
.classList
.remove("hidden");

setStatus(
"Waiting for Stage 1"
);

return;

}


currentEntries =
await loadEntries(
currentRound.id
);


$("waitingCard")
.classList
.add("hidden");

$("roundCard")
.classList
.remove("hidden");

$("choicesCard")
.classList
.remove("hidden");


$("roundTitle").textContent =
field(
currentRound,
[
"title",
"name"
],
"Stage 1"
);


render();


setStatus(
"Voting is live",
true
);


countdown();


} catch (error) {

console.error(
"Beat the DJ error:",
error
);


setStatus(
"Connection problem",
false,
true
);


$("waitingCard")
.classList
.remove("hidden");


$("message").innerHTML =
'<span class="error">' +
esc(
error.message ||
"Unable to load the round."
) +
"</span>";

}

}


$("refreshBtn").onclick =
refresh;


refresh();


setInterval(
refresh,
5000
);


setInterval(
countdown,
1000
);

</script>

</body>
</html>
