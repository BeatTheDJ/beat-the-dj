<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat The DJ — DJ Control</title>

<style>
:root{
  --bg:#090909;
  --panel:#151515;
  --panel2:#202020;
  --text:#f5f5f2;
  --muted:#999;
  --line:#333;
  --accent:#e8ff38;
  --danger:#ff7777;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:24px 16px 45px;
}

header{
  padding:8px 0 24px;
}

.eyebrow{
  font-size:12px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:800;
}

h1{
  font-size:clamp(42px,10vw,64px);
  line-height:.9;
  letter-spacing:-.05em;
  margin:8px 0;
}

.strap{
  margin:0;
  color:#aaa;
  font-size:16px;
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:12px;
  font-size:13px;
  margin-bottom:14px;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
  margin-right:8px;
}

.live .dot{
  background:var(--accent);
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
}

.card h2{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.14em;
  color:#aaa;
  margin:0 0 14px;
}

.request{
  background:var(--panel2);
  border:1px solid #383838;
  border-radius:13px;
  padding:16px;
  margin-bottom:10px;
}

.request:last-child{
  margin-bottom:0;
}

.song{
  font-size:21px;
  font-weight:800;
  line-height:1.15;
}

.artist{
  font-size:15px;
  color:#aaa;
  margin-top:4px;
}

.requester{
  margin-top:13px;
  padding-top:10px;
  border-top:1px solid #383838;
  font-size:12px;
  color:var(--accent);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.time{
  margin-top:5px;
  font-size:11px;
  color:#666;
}

.empty{
  color:#777;
  font-size:14px;
  padding:10px 0;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:var(--accent);
  color:#090909;
  font:inherit;
  font-weight:800;
  cursor:pointer;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.actions button{
  width:100%;
  padding:11px 8px;
  font-size:13px;
}

.actions .reject{
  background:#333;
  color:#f5f5f2;
  border:1px solid #555;
}

.roundVotes{
  margin:18px 0;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.voteRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #333;
  font-size:15px;
}

.voteRow span{
  min-width:0;
}

.voteRow strong{
  font-size:18px;
  min-width:28px;
  text-align:right;
}
  background:#333;
  color:#f5f5f2;
  border:1px solid #555;
}
.error{
  color:var(--danger);
  font-size:13px;
}

footer{
  text-align:center;
  color:#555;
  font-size:11px;
  padding-top:10px;
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="eyebrow">Beat The DJ</div>
  <h1>DJ Control</h1>
  <p class="strap">Incoming requests</p>
</header>

<div id="status" class="status">
  <span>
    <span class="dot"></span>
    <span id="statusText">Connecting…</span>
  </span>
  <span id="requestCount">0 requests</span>
</div>

<section class="card">
  <h2>Current Round</h2>

  <div class="request">
    <div class="song" id="roundTitle">
      No open round
    </div>

    <div class="artist" id="roundStatus">
      Waiting for a round
    </div>

  <div id="roundVotes">
  Loading votes...
  </div>  <button id="closeRoundBtn" disabled>
      CLOSE VOTE
    </button>
  </div>
</section><section class="card">
  <h2>Requests</h2>
  <div id="requests">
    <div class="empty">Loading requests…</div>
  </div>
</section>

<section class="card">
  <button id="refreshBtn">Refresh requests</button>
</section>

<footer>
  BEAT THE DJ • DJ CONTROL
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://lxojmyujlljkhtnudzmr.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4b2pteXVqbGxqa2h0bnVkem1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTU2MTgsImV4cCI6MjEwNDkzMTYxOH0.AicCDkKSifzeK9pE1aHhTbyY4exRMvUD771_vld9wKk";

const EVENT_ID =
  "4f56de4d-be9c-4312-b56d-2950286bacc2";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

function esc(value){
  return String(value ?? "")
    .replace(/[&<>"']/g, character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[character]));
}

function setStatus(text,live=false){
  document.getElementById("statusText").textContent = text;
  document.getElementById("status").classList.toggle("live",live);
}
async function closeRound(){

  try{

    const roundResult = await db
      .from("rounds")
      .select("id")
      .eq("event_id",EVENT_ID)
      .eq("status","open")
      .order("round_number",{ascending:false})
      .limit(1)
      .maybeSingle();

    if(roundResult.error){
      throw roundResult.error;
    }

    const round = roundResult.data;

    if(!round){
      alert("There is no open round.");
      return;
    }

    const votesResult = await db
      .from("votes")
      .select("option_id")
      .eq("round_id",round.id);

    if(votesResult.error){
      throw votesResult.error;
    }

    const counts = {};

    votesResult.data.forEach(vote => {
      counts[vote.option_id] =
        (counts[vote.option_id] || 0) + 1;
    });

    const optionsResult = await db
      .from("options")
      .select("id,artist,track")
      .eq("round_id",round.id)
      .order("position",{ascending:true});

    if(optionsResult.error){
      throw optionsResult.error;
    }

    const options = optionsResult.data || [];

    const highest =
      Math.max(
        0,
        ...options.map(option =>
          counts[option.id] || 0
        )
      );

    const winners =
      options.filter(option =>
        (counts[option.id] || 0) === highest
      );

    const winningOption =
      highest > 0 && winners.length === 1
        ? winners[0]
        : null;

    const updateResult = await db
      .from("rounds")
      .update({
  status:"closed",
  closed_at:new Date().toISOString()
})
      })
      .eq("id",round.id);

    if(updateResult.error){
      throw updateResult.error;
    }

    document.getElementById("closeRoundBtn").disabled = true;

    await loadRound();

    alert(
      winningOption
        ? "Vote closed. Winner: " +
          winningOption.artist +
          " — " +
          winningOption.track
        : "Vote closed. There was a tie or no votes."
    );

  }catch(error){

    console.error(
      "Close round error:",
      error
    );

    alert(
      error.message ||
      "Unable to close the vote."
    );
  }

  }
async function loadRound(){

  try{

    const result = await db
      .from("rounds")
      .select("id,title,status,round_number")
      .eq("event_id",EVENT_ID)
      .eq("status","open")
      .order("round_number",{ascending:false})
      .limit(1)
      .maybeSingle();

    if(result.error){
      throw result.error;
    }

    const round = result.data;

    const title =
      document.getElementById("roundTitle");

    const status =
      document.getElementById("roundStatus");
    const closeButton =
  document.getElementById("closeRoundBtn");

    if(!round){closeButton.disabled = true;

      title.textContent =
        "No open round";

      status.textContent =
        "Waiting for a round";

      return;
    }

  closeButton.disabled = false;
    title.textContent =
      round.title ||
      "Round " + round.round_number;

    status.textContent =
      "Round " +
      round.round_number +
      " • VOTING OPEN";

  }catch(error){

    console.error(
      "Round loading error:",
      error
    );

    document.getElementById("roundTitle").textContent =
      "Unable to load round";

    document.getElementById("roundStatus").textContent =
      error.message ||
      "Connection problem";

  }

  }
 async function loadVoteTotals(){

  try{

    const roundResult = await db
      .from("rounds")
      .select("id")
      .eq("event_id",EVENT_ID)
      .eq("status","open")
      .order("round_number",{ascending:false})
      .limit(1)
      .maybeSingle();

    if(roundResult.error){
      throw roundResult.error;
    }

    const round = roundResult.data;

    const container =
      document.getElementById("roundVotes");

    if(!round){

      container.textContent =
        "No active vote";

      return;
    }

    const optionsResult = await db
      .from("options")
      .select("id,artist,track,position")
      .eq("round_id",round.id)
      .order("position");

    if(optionsResult.error){
      throw optionsResult.error;
    }

    const votesResult = await db
      .from("votes")
      .select("option_id")
      .eq("round_id",round.id);

    if(votesResult.error){
      throw votesResult.error;
    }

    const counts = {};

    votesResult.data.forEach(vote => {

      counts[vote.option_id] =
        (counts[vote.option_id] || 0) + 1;

    });

    container.innerHTML =
      optionsResult.data.map(option => {

        const votes =
          counts[option.id] || 0;

        return `
          <div class="voteRow">
            <span>
              ${option.artist} — ${option.track}
            </span>
            <strong>
              ${votes}
            </strong>
          </div>
        `;

      }).join("");

  }catch(error){

    console.error(
      "Vote loading error:",
      error
    );

    document.getElementById("roundVotes").textContent =
      "Unable to load votes";

  }

  } async function loadRequests(){

  try{

    const result = await db
      .from("requests")
      .select(
        "id,requester_name,artist,song,status,created_at"
      )
      .eq("event_id",EVENT_ID)
      .order("created_at",{ascending:false});

    if(result.error){
      throw result.error;
    }

    const requests = result.data || [];
    const box = document.getElementById("requests");

    document.getElementById("requestCount").textContent =
      requests.length +
      " request" +
      (requests.length === 1 ? "" : "s");

    if(!requests.length){
      box.innerHTML =
        '<div class="empty">No requests yet.</div>';

      setStatus("Waiting for requests",true);
      return;
    }

    box.innerHTML = requests.map(request => {

      const time = request.created_at
        ? new Date(request.created_at).toLocaleTimeString(
            [],
            {hour:"2-digit",minute:"2-digit"}
          )
        : "";

      return `
        <div class="request">

          <div class="song">
            ${esc(request.song)}
          </div>

          <div class="artist">
            ${esc(request.artist)}
          </div>

          <div class="requester">
            Requested by ${esc(request.requester_name)}
            </div>
          <div class="actions">
  <button onclick="updateRequest('${request.id}','submitted')">
    ✓ ACCEPT
  </button>
  <button class="reject" onclick="updateRequest('${request.id}','rejected')">
    ✕ NOT TONIGHT
  </button>
</div>

          <div class="time">
            ${esc(request.status || "pending")} • ${esc(time)}
          </div>

        </div>
      `;

    }).join("");

    setStatus("Live • requests updating",true);

  }catch(error){

    console.error("Request loading error:",error);

    document.getElementById("requests").innerHTML =
      '<div class="error">' +
      esc(error.message || "Unable to load requests.") +
      '</div>';

    setStatus("Connection problem",false);
  }
}
async function updateRequest(id,status){

  try{

    const result = await db
      .from("requests")
      .update({status:status})
      .eq("id",id)
      .eq("event_id",EVENT_ID);

    if(result.error){
      throw result.error;
    }

    await loadRequests();

  }catch(error){

    console.error("Request update error:",error);

    alert(
      error.message ||
      "Unable to update this request."
    );
  }
  }
document.getElementById("refreshBtn").onclick =
  loadRequests;
document.getElementById("closeRoundBtn").onclick =
  closeRound;
loadRequests();
  loadRound();
  loadVoteTotals();

setInterval(
  loadRequests,
  5000);setInterval(
  loadVoteTotals,
  5000
);

</script>

</body>
</html>
