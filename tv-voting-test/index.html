async function rpc(n,b){const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+n,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(b||{})});if(!r.ok)throw Error(n+" HTTP "+r.status);return r.json()}

function render(os,cs){let list=(os||[]).slice().sort((a,b)=>Number(a.position||0)-Number(b.position||0)).slice(0,4),board=document.getElementById("votingBoard");if(!list.length){board.innerHTML='<div class="standby"><h2>GET READY...</h2><p>Requests are being prepared for your votes.</p></div>';return}let total=list.reduce((s,o)=>s+Number(cs[o.id]||0),0),max=Math.max(0,...list.map(o=>Number(cs[o.id]||0)));board.innerHTML=list.map((o,i)=>{let v=Number(cs[o.id]||0),p=total?Math.round(v/total*100):0,l=max>0&&v===max;return'<article class="card '+(l?"lead":"")+'">'+art(o)+'<div class="num">'+String(i+1).padStart(2,"0")+'</div><div class="track">'+esc(o.track||o.label||"")+'</div><div class="artist">'+esc(o.artist||"")+'</div><div class="votes">'+v+'<small>VOTES</small></div><div class="bar"><div class="fill" style="width:'+p+'%"></div></div><div class="status">'+(l?"CURRENT LEADER":"LIVE VOTE")+'</div></article>'}).join("")}
async function load(){try{let rr=await rpc("get_public_round",{p_mode:"open"}),r=rr?.[0];if(!r){document.getElementById("roundNumber").textContent="—";document.getElementById("roundTitle").textContent="STAND BY";return}document.getElementById("roundNumber").textContent=r.round_number||"";document.getElementById("roundTitle").textContent=String(r.title||"").toUpperCase()||"VOTING NOW";let [o,v]=await Promise.all([rpc("get_public_options_with_artwork",{p_round_id:r.id}),rpc("get_public_vote_counts",{p_round_id:r.id})]);render(o,Object.fromEntries((v||[]).map(x=>[x.option_id,Number(x.vote_count||0)])))}catch(e){console.error("TV load",e)}}load();setInterval(load,2000);window.addEventListener("online",load);
